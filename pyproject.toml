[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-gaussian-world"
version = "0.1.0"
description = "Causal Gaussian driving world models with native DGGT and CPU development workflows"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "torch>=2.4,<2.6", "Pillow>=10", "scipy>=1.10", "opencv-python-headless>=4.8,<5", "requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=8"]
dggt = ["accelerate>=0.30", "huggingface_hub>=0.24", "torchvision>=0.19,<0.21"]

[tool.setuptools.packages.find]
include = ["drive_gaussian_world*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
